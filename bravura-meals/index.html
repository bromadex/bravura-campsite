<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bravura Zimbabwe — Meal Management</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo/favicon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#982329" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bravura" />
    <!-- Google Material Symbols Rounded -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* ════════════════════════════════════════════════════════════════════
         Bravura Design System — colour tokens
         Anchored to the real logo: #982329 (maroon, sampled directly from
         the logo file — the single most common opaque pixel colour) and
         #FF7175 / #F8ACB8 (the logo's coral and soft-pink accents). Every
         other value here is mathematically derived from those three real
         colours, not picked by eye — tints/shades via HSL lightness and
         saturation adjustment, not arbitrary hex guesses.

         Dark theme is NOT an inversion. Status colours in particular are
         independently tuned: the light-mode versions are dark, saturated
         colours meant to sit on white with dark text; on a dark surface
         those same values would have poor contrast, so each one has its
         own deliberately brightened dark-mode counterpart below.
         ════════════════════════════════════════════════════════════════════ */
      :root {
        /* Brand */
        --color-primary:        #982329;
        --color-primary-dark:   #66181C;
        --color-primary-light:  #D4434A;
        --color-primary-hover:  #7F1D22;
        --color-on-primary:     #FFFFFF;

        /* Accent — the logo's coral/pink, for secondary emphasis */
        --color-accent:         #FF7175;
        --color-accent-dark:    #FF343A;
        --color-accent-light:   #F8ACB8;

        /* Surfaces */
        --color-bg:             #F5F5F5;
        --color-surface:        #FFFFFF;
        --color-surface-variant:#EFECEC;
        --color-surface-hover:  #F3F2F2;
        --color-sidebar:        #982329;
        --color-sidebar-mid:    #7A1B20;
        --color-active-bar:     #F4A896;
        --color-outline:        #CEB9BA;
        --color-outline-variant:#D8CDCE;

        /* Text */
        --color-text:           #1C0A0A;
        --color-text-medium:    #5C3C3C;
        --color-text-low:       #9E8080;

        /* Status — base */
        --color-error:          #B3261E;
        --color-success:        #386A20;
        --color-warning:        #7D5700;
        --color-info:           #1558A6;

        /* Status — tint pairs (badge backgrounds + matching text) */
        --status-success-bg:    #E8F5E9; --status-success-text:  #1B5E20;
        --status-warning-bg:    #FFF8E1; --status-warning-text:  #7D5700;
        --status-error-bg:      #FDECEA; --status-error-text:    #B3261E;
        --status-neutral-bg:    #F5F5F5; --status-neutral-text:  #757575;
        --status-info-bg:       #E3F2FD; --status-info-text:     #1558A6;
        --status-tertiary-bg:   #EDE7F6; --status-tertiary-text: #4A3C8C;

        /* Meal-specific accents */
        --color-breakfast:      #BF5400;
        --color-lunch:          #1A6B52;
        --color-supper:         #4A3C8C;

        /* Elevation — light theme uses real shadows */
        --shadow-1: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
        --shadow-2: 0 2px 6px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.08);
        --shadow-3: 0 8px 24px rgba(0,0,0,.14);
      }

      [data-theme="dark"] {
        /* Brand — lighter & more vivid than light-mode primary, so it
           stays legible against a dark surface while still reading as
           the same maroon */
        --color-primary:        #D8545A;
        --color-primary-dark:   #982329;
        --color-primary-light:  #E89094;
        --color-primary-hover:  #DF757A;
        --color-on-primary:     #1C0A0A;

        --color-accent:         #FF8C8F;
        --color-accent-dark:    #FF7175;
        --color-accent-light:   #C97D86;

        /* Surfaces — warm near-black, not pure black, with a maroon undertone */
        --color-bg:             #15100F;
        --color-surface:        #1C1414;
        --color-surface-variant:#2A1D1D;
        --color-surface-hover:  #332323;
        --color-sidebar:        #120D0D;
        --color-sidebar-mid:    #1C1414;
        --color-active-bar:     #D8545A;
        --color-outline:        #4A3838;
        --color-outline-variant:#3A2C2C;

        --color-text:           #F2E8E8;
        --color-text-medium:    #C9B8B8;
        --color-text-low:       #8F7A7A;

        --color-error:          #DF6962;
        --color-success:        #68BA40;
        --color-warning:        #E7A306;
        --color-info:           #4990E2;

        --status-success-bg:    #2F4528; --status-success-text:  #74D17B;
        --status-warning-bg:    #5C4217; --status-warning-text:  #FAC64F;
        --status-error-bg:      #5A201D; --status-error-text:    #EFB2AE;
        --status-neutral-bg:    #443C3C; --status-neutral-text:  #DBDBDB;
        --status-info-bg:       #23324D; --status-info-text:     #98C0EF;
        --status-tertiary-bg:   #352844; --status-tertiary-text: #BEB7DD;

        --color-breakfast:      #FA862B;
        --color-lunch:          #34B78F;
        --color-supper:         #7F73BB;

        /* Elevation — dark surfaces don't read shadows well (black-on-black
           is invisible); a soft border-like glow does the same visual job */
        --shadow-1: 0 1px 3px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.04);
        --shadow-2: 0 2px 6px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05);
        --shadow-3: 0 8px 24px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Google Sans', 'Segoe UI', Arial, sans-serif; background: var(--color-bg); color: var(--color-text); }
      .material-symbols-rounded {
        font-family: 'Material Symbols Rounded';
        font-weight: normal; font-style: normal;
        font-size: 20px; line-height: 1; letter-spacing: normal;
        text-transform: none; display: inline-block; white-space: nowrap;
        word-wrap: normal; direction: ltr;
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
        user-select: none; vertical-align: middle;
      }
      /* Filled variant for active states */
      .material-symbols-rounded.filled {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20;
      }
      input, select, textarea, button { font-family: inherit; }
      /* ── Print styles ─────────────────────────────────────────────── */

      /* Utility classes — toggled by @media print below */
      .no-print   { /* visible on screen, hidden when printing */ }
      .print-only { display: none; /* hidden on screen, shown when printing */ }

      @media print {
        @page { margin: 14mm 12mm; size: A4 portrait; }

        /* Ensure backgrounds & colours print */
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

        /* Reset html/body so content flows freely across pages — always
           light/white on paper regardless of which theme is active on
           screen, since this is print output, not a screen surface. */
        html, body {
          height: auto !important;
          overflow: visible !important;
          background: #fff !important;
          color: #000 !important;
          font-size: 12px !important;
        }

        /* Flatten the React flex shell completely */
        #root,
        #root > div {
          display: block !important;
          height: auto !important;
          overflow: visible !important;
          width: 100% !important;
        }

        /* Hide the sidebar nav entirely */
        #root > div > nav { display: none !important; }

        /* The main column (right of sidebar) */
        #root > div > div {
          display: block !important;
          height: auto !important;
          overflow: visible !important;
          width: 100% !important;
        }

        /* Top app bar */
        #root > div > div > div:first-child { display: none !important; }

        /* The scrollable page content area */
        #root > div > div > div:last-child {
          overflow: visible !important;
          height: auto !important;
          padding: 0 !important;
          background: #fff !important;
        }

        /* Hide controls that make no sense on paper */
        .no-print { display: none !important; }

        /* Show print-only elements (report header) */
        .print-only { display: block !important; }

        /* Remove card shadows / borders */
        .print-page > div { box-shadow: none !important; }

        /* Make sure table wrapper doesn't clip */
        div { overflow: visible !important; }

        /* Table across multiple pages */
        table {
          width: 100% !important;
          border-collapse: collapse !important;
          font-size: 11px !important;
          page-break-inside: auto !important;
        }
        thead { display: table-header-group !important; }  /* repeat on every page */
        tfoot { display: table-footer-group !important; }  /* repeat on every page */
        tr    { page-break-inside: avoid !important; page-break-after: auto !important; }
        td, th { padding: 5px 7px !important; }

        /* Stat card grid — lay flat in a row */
        .print-page > div[style*="grid"] {
          display: flex !important;
          flex-wrap: wrap !important;
          gap: 6px !important;
          margin-bottom: 10px !important;
        }
        .print-page > div[style*="grid"] > div {
          flex: 1 !important;
          min-width: 70px !important;
          padding: 6px 8px !important;
          border: 1px solid #ddd !important;
          border-radius: 6px !important;
          box-shadow: none !important;
        }
      }
      /* Scrollbar styling — wider + always-visible track so the thumb never
         reads as "gone" mid-drag (a bare 6px thumb on a transparent track
         can look like it vanished once the pointer moves off it). */
      ::-webkit-scrollbar { width: 12px; height: 12px; }
      ::-webkit-scrollbar-track { background: rgba(0,0,0,.04); }
      ::-webkit-scrollbar-thumb {
        background: var(--color-outline);
        border-radius: 6px;
        border: 3px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover,
      ::-webkit-scrollbar-thumb:active {
        background: var(--color-primary);
        background-clip: padding-box;
      }
      * { scrollbar-width: thin; scrollbar-color: var(--color-outline) rgba(0,0,0,.04); }
    </style>
    <script>
      // Applied synchronously, before React mounts, so the correct theme is
      // in place on the very first paint — without this, a dark-mode user
      // would see a flash of the light theme on every load before React's
      // own effect had a chance to run.
      (function () {
        // Theme locked to light until dark palette is polished.
        document.documentElement.setAttribute('data-theme', 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Capture the install prompt as early as possible — Chrome can fire
      // beforeinstallprompt before React mounts, and if nothing catches it,
      // the event is lost until the next page load.
      window.__deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('bravura-install-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__deferredInstallPrompt = null;
        try { localStorage.removeItem('pwa_install_dismissed'); } catch (e) {}
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
